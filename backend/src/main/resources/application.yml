spring:
  application:
    name: wireblog-backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: jdbc:postgresql://localhost:5432/wireblog
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: root

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

server:
  port: 8080

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-before-deploying-please}
    expiration-ms: 604800000   # 7 days
  news:
    api-key: ${NEWS_API_KEY:}
    base-url: https://newsapi.org/v2/top-headlines
    country: in
  upload:
    dir: uploads
    base-url: http://localhost:8080/uploads
    cloudinary-cloud-name: ""
    cloudinary-api-key: ""
    cloudinary-api-secret: ""

logging:
  level:
    com.wireblog: INFO

---
# Production profile - point at Postgres + read secrets from env vars
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

app:
  jwt:
    secret: ${JWT_SECRET}
  news:
    api-key: ${NEWS_API_KEY}
